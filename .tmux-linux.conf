# change the prefix key to C-a
#set -g prefix C-a
#unbind C-b
#bind C-a send-prefix

# reload config (prefix r)
bind r source ~/.tmux.conf \; display 'Configuration reloaded!'

# status bar
set-window-option -g window-status-current-style bg=colour8
set-window-option -g window-status-current-style fg=colour2
set-window-option -g window-status-activity-style bg=colour8
set-window-option -g window-status-activity-style fg=yellow
set -g status-left-length 32
set -g status-left ' #(whoami)@#(hostname -s) > '
set -g status-right '#(uptime -p)'
set -g status-interval 60


# set clock colour green
set -g clock-mode-colour colour2


# set window notifications
set -g monitor-activity on
#set -g visual-activity on


# set mouse on and unbind selection
set -g mouse on
unbind -n MouseDown3Pane


# set copy-mode
# prefix [   to enter copy-mode
# space      to start the selection
# enter      to end the selection and copy
# prefix ]   to paste (or middle-button)
# or select with mouse
set -g mode-keys vi # Use vi-style navigation rules
unbind -T copy-mode-vi Enter # Unbind the default enter key action
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -in" # Copy to the system clipboard on pressing Enter
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -in" # Copy to the system clipboard immediately when releasing mouse drag
bind ] run "xclip -selection clipboard -out | tmux load-buffer - && tmux paste-buffer" # Paste from system clipboard using prefix + ]
bind -n MouseDown2Pane run "xclip -selection clipboard -out | tmux load-buffer - && tmux paste-buffer" # Paste from system clipboard using absolute Middle Mouse Click


# toggle synchronized input to all panes in current window
unbind s
bind s setw synchronize-panes off \; display "synchronize-panes OFF"
bind S setw synchronize-panes on \; display "synchronize-panes ON"

# start countdown -> https://github.com/a-p-z/countdown
bind T send-keys ' ~/.local/bin/countdown; clear' Enter
